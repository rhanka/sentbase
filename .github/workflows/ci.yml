name: CI

on:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  attribution:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checked.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: checked
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # Inspect commit objects with base policy, never the PR's Makefile.
        run: |
          set -euo pipefail
          policy_ref="origin/$BASE_REF"
          git rev-parse --verify "$policy_ref^{commit}" >/dev/null
          policy_path=$(git ls-tree --name-only "$policy_ref" -- tools/check-attribution.sh)
          policy=$(mktemp)
          trap 'rm -f "$policy"' EXIT
          if [ -n "$policy_path" ]; then
            git show "$policy_ref:tools/check-attribution.sh" > "$policy"
            echo "Attribution policy: $policy_ref ($(git rev-parse "$policy_ref"))"
          else
            echo 'BOOTSTRAP: base has no attribution checker; using the PR revision'
            git show HEAD:tools/check-attribution.sh > "$policy"
          fi
          range=HEAD
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$policy_ref..HEAD"
            # Metadata may become a future merge message; pass explicit human identities.
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" |
              GIT_AUTHOR_NAME='PR metadata' GIT_AUTHOR_EMAIL='metadata@example.org' \
              GIT_COMMITTER_NAME='PR metadata' GIT_COMMITTER_EMAIL='metadata@example.org' \
              sh "$policy" --message-file -
          fi
          sh "$policy" "$range"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  no-python:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checked.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: checked
        run: make check-no-python ci-source

  lint:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checked.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: checked
        env:
          SCOPE_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || format('origin/{0}...HEAD', github.event.repository.default_branch) }}
        run: make lint check-ci check-manifests check-license scope-check ci-source

  test:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checked.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: checked
        run: make test ci-source

  ts:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.checked.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: checked
        run: make check-ts vitest test-image-receipt test-attribution test-workflow ci-source

  image:
    runs-on: ubuntu-latest
    needs: [attribution, no-python, lint, test, ts]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build, smoke-test and verify the image receipt
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: make image-receipt verify-image-receipt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci/image-receipt.json
          if-no-files-found: error
          retention-days: 14
